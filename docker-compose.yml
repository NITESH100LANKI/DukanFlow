services:
  db:
    image: postgres:15-alpine
    container_name: dukaanflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dukaanflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dukaanflow}
      POSTGRES_DB: ${DB_NAME:-dukaanflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dukaanflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dukaanflow} -d ${DB_NAME:-dukaanflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dukaanflow_pgdata:
    name: dukaanflow_pgdata

